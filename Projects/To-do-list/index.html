<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To do list app </title>
</head>


<body>
    <main class="container">
        <h1>To do list aap</h1>

        <form id="todo-form">
            <input id="todo-input" type="text" placeholder="Add a new task here" />
            <button type="submit">Add</button>
        </form>

        <ul id="todo-list">
            <li>example list </li>
        </ul>

        <div class="footer">
            <span id="count"> 0 tasks </span>
            <button id="clear-completed">clear clear-completed </button>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
